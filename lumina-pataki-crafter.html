<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMINA — Bomb Maker</title><link rel="stylesheet" href="lumina-pataki-role.css"></head><body data-role="crafter"><script src="lumina-pataki-role.js"></script><script>(()=>{const modal=document.getElementById('endModal'),title=document.getElementById('endTitle');function save(){if(!title.textContent.includes('Structure complete!')&&!title.textContent.includes('Rival structure complete'))return;const reg=JSON.parse(localStorage.getItem('lumina_demo_registration')||'{}'),code=(reg.teamCode||'DEMO').trim().toLowerCase(),all=JSON.parse(localStorage.getItem('lumina_demo_scores')||'{}'),row=all[code]||{teamName:reg.teamName||'Demo team',rounds:{}};row.teamName=reg.teamName||row.teamName;row.rounds.r1=Math.max(row.rounds.r1||0,title.textContent.includes('Structure complete!')?150:50);all[code]=row;localStorage.setItem('lumina_demo_scores',JSON.stringify(all));localStorage.setItem('lumina_demo_last_result',JSON.stringify({round:1,won:title.textContent.includes('Structure complete!'),score:row.rounds.r1,teamName:row.teamName,at:new Date().toISOString()}))}new MutationObserver(save).observe(modal,{attributes:true,attributeFilter:['class']})})();</script></body></html>
