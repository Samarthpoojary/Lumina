<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>LUMINA — Crack the Circuit Code</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');:root{--bg:#090d18;--line:#29384c;--ink:#f4f2eb;--gold:#f7b93e;--gold2:#ffe3a0;--red:#fa654d;--mint:#71dfbd;--mono:'DM Mono',monospace;--body:'Manrope',sans-serif;--display:'Space Grotesk',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 18%,#f7b93e13,transparent 33%),var(--bg);color:var(--ink);font-family:var(--body)}.wrap{width:min(940px,calc(100% - 28px));margin:auto}.top{height:68px;border-bottom:1px solid #ffffff15;display:flex;align-items:center;justify-content:space-between}.brand{font:700 17px var(--display);letter-spacing:.1em}.brand small{display:block;color:#8794a7;font:8px var(--mono);letter-spacing:.13em;margin-top:3px}.back{border:1px solid #2c3b50;border-radius:8px;background:#111a27;color:#d5dce4;padding:9px 11px;text-decoration:none;font-size:9px}.main{padding:28px 0 48px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:17px}.kicker{font:9px var(--mono);letter-spacing:.15em;color:var(--gold)}h1{font:700 clamp(27px,4vw,38px)/1.07 var(--display);letter-spacing:-.05em;margin:6px 0}.head p{font-size:10px;color:#9eabba;line-height:1.6;margin:0}.timer{text-align:center;min-width:82px;border:1px solid #334258;border-radius:9px;background:#121c29;padding:8px}.timer small{font:8px var(--mono);color:#8491a5}.timer b{display:block;font:600 18px var(--mono);color:var(--gold2);margin-top:3px}.shell{border:1px solid #2c3a4d;border-radius:15px;background:linear-gradient(145deg,#131d2b,#0d1521);overflow:hidden}.steps{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #ffffff14}.step{padding:13px 15px;color:#77869a;font:8px var(--mono);letter-spacing:.07em;border-right:1px solid #ffffff10}.step:last-child{border:0}.step.active{color:var(--gold2);background:#f7b93e0b}.step.done{color:var(--mint)}.stage{padding:27px 30px 30px;min-height:390px}.stage-meta{color:#8694a8;font:8px var(--mono);letter-spacing:.12em}.stage h2{font:600 22px var(--display);margin:10px 0 7px}.prompt{color:#aab5c3;font-size:11px;line-height:1.7;max-width:650px}.diagram{margin:20px 0;padding:18px;border:1px solid #2b3a4e;border-radius:11px;background:#0a111c;color:#e0e5eb;font:11px/1.8 var(--mono);text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.choice{min-height:48px;border:1px solid #35465c;border-radius:8px;background:#131e2c;color:#d3dae3;font-size:10px;font-weight:700;transition:.17s}.choice:hover{border-color:var(--gold);color:var(--gold2);background:#f7b93e0c}.choice.correct{border-color:var(--mint);color:var(--mint)}.choice.wrong{border-color:var(--red);color:#ff9b88}.feedback{min-height:25px;margin-top:12px;color:var(--mint);font-size:10px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;color:#8290a4;font:8px var(--mono)}.bar{height:6px;background:#070c14;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e2a133,#ffe19a);transition:width .25s}.modal{position:fixed;inset:0;background:#060a12e9;display:none;place-items:center;padding:18px;z-index:3}.modal.show{display:grid}.modalbox{width:min(390px,100%);padding:26px;border:1px solid #38495e;border-radius:15px;background:#121c2a;text-align:center}.modalbox h2{font:600 23px var(--display)}.modalbox p{color:#a2aebb;font-size:11px;line-height:1.6}.modalbox button,.modalbox a{display:inline-block;margin:4px;border:0;border-radius:8px;padding:11px 14px;background:linear-gradient(100deg,#f7bd4a,#f17e56);color:#17120b;text-decoration:none;font-size:10px;font-weight:900}.modalbox a{border:1px solid #33445a;background:#111a27;color:#d4dce5}.toast{position:fixed;bottom:16px;left:50%;transform:translate(-50%,8px);opacity:0;background:#142133;border:1px solid #3b4c63;color:#dfe4ea;padding:10px 14px;border-radius:8px;font-size:9px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.stage{padding:22px 17px}.steps{grid-template-columns:1fr 1fr}.step:nth-child(2){border-right:0}.step:nth-child(-n+2){border-bottom:1px solid #ffffff10}.choices{grid-template-columns:1fr}.head{align-items:flex-start}.head p{max-width:260px}}
</style></head><body><header class="top wrap"><div class="brand">LUMINA<small>ROUND 02 · CRACK THE CIRCUIT CODE</small></div><a class="back" href="lumina-leaderboard.html">LEADERBOARD</a> &nbsp; <a class="back" href="lumina-home.html#home">← TEAM HOME</a></header><main class="main wrap"><div class="head"><div><div class="kicker">ROUND 02 &nbsp; / &nbsp; FOUR LOCKS</div><h1>Crack the Circuit Code</h1><p>Clear four ECE locks before time runs out to open the vault.</p></div><div class="timer"><small>TIME LEFT</small><b id="clock">04:00</b></div></div><section class="shell"><div id="steps" class="steps"></div><div class="stage"><div class="stage-meta" id="stageMeta">LEVEL 1 / 4</div><h2 id="title"></h2><p class="prompt" id="prompt"></p><div id="diagram" class="diagram"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="bottom"><span id="progressText">VAULT SEAL 0%</span><span id="scoreText">SCORE 0</span></div><div class="bar"><i id="progress"></i></div></div></section></main><div id="end" class="modal"><div class="modalbox"><div class="kicker" id="endKicker">VAULT OPEN</div><h2 id="endTitle">You cracked it!</h2><p id="endMessage"></p><a href="lumina-home.html#home">Back to team home</a><a href="lumina-leaderboard.html">View leaderboard</a><button id="retry">Play again</button></div></div><script>
(()=>{const levels=[{name:'LOGIC LOCK',title:'Read the logic tree',prompt:'The NAND gate receives A = 1 and B = 0. What is its output?',diagram:'A = 1  ─┐<br>        NAND  →  ?<br>B = 0  ─┘',answers:['0','1','Undefined'],correct:1},{name:'RESISTOR MYSTERY',title:'Decode the color bands',prompt:'A four-band resistor shows Brown · Black · Red · Gold. What is its nominal resistance?',diagram:'BROWN  ·  BLACK  ·  RED  ·  GOLD',answers:['100 Ω ±5%','1 kΩ ±5%','10 kΩ ±5%'],correct:1},{name:'CIRCUIT DETECTIVE',title:'Find the open circuit',prompt:'The battery, switch, resistor, and LED are in series. The LED stays dark. Which fault breaks the path?',diagram:'Battery (+) → switch → resistor → LED → Battery (−)<br>                           ↑ inspect this junction',answers:['Open wire between resistor and LED','LED is oriented correctly','Battery negative is connected'],correct:0},{name:'BINARY BREAKER',title:'Translate the final key',prompt:'Convert the 8-bit binary number to decimal to unlock the code.',diagram:'10110110₂  =  ?₁₀',answers:['172','182','186'],correct:1}];let level=0,seconds=240,score=0,active=true,timer,locked=false;const $=id=>document.getElementById(id);function render(){const l=levels[level];$('stageMeta').textContent='LEVEL '+(level+1)+' / 4';$('title').textContent=l.title;$('prompt').textContent=l.prompt;$('diagram').innerHTML=l.diagram;$('steps').innerHTML=levels.map((x,i)=>'<div class="step '+(i===level?'active':i<level?'done':'')+'">'+(i<level?'✓':'0'+(i+1))+' &nbsp; '+x.name+'</div>').join('');$('choices').innerHTML=l.answers.map((x,i)=>'<button class="choice" data-choice="'+i+'">'+x+'</button>').join('');$('choices').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.choice),b)));$('progressText').textContent='VAULT SEAL '+Math.round(level/4*100)+'%';$('progress').style.width=(level/4*100)+'%';$('scoreText').textContent='SCORE '+score;$('feedback').textContent='';locked=false}function answer(choice,button){if(!active||locked)return;locked=true;const correct=choice===levels[level].correct;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(correct){button.classList.add('correct');score+=100+Math.floor(seconds/10);$('feedback').textContent='Correct. Lock released.';setTimeout(()=>{level++;if(level===levels.length)finish(true);else render()},650)}else{button.classList.add('wrong');seconds=Math.max(0,seconds-8);$('feedback').textContent='Not quite. Eight seconds removed; review the clue and try again.';if(seconds===0){finish(false);return}setTimeout(()=>{document.querySelectorAll('.choice').forEach(x=>{x.disabled=false;x.classList.remove('wrong','correct')});locked=false;$('feedback').textContent='Try again when ready.'},650)}}function recordScore(points){const reg=JSON.parse(localStorage.getItem('lumina_demo_registration')||'{}'),key=(reg.teamCode||'DEMO').trim().toLowerCase(),all=JSON.parse(localStorage.getItem('lumina_demo_scores')||'{}'),row=all[key]||{teamName:reg.teamName||'Demo team',rounds:{}};row.teamName=reg.teamName||row.teamName;row.rounds.r2=Math.max(row.rounds.r2||0,points);all[key]=row;localStorage.setItem('lumina_demo_scores',JSON.stringify(all));localStorage.setItem('lumina_demo_last_result',JSON.stringify({round:2,score:points,won:true,teamName:row.teamName,at:new Date().toISOString()}))}function finish(won){active=false;clearInterval(timer);$('endKicker').textContent=won?'VAULT OPEN':'TIME UP';$('endTitle').textContent=won?'You cracked it!':'The vault stayed locked';$('endMessage').textContent=won?'All four locks cleared. Your demo score: '+score+'.':'You cleared '+level+' of 4 locks. Your demo score: '+score+'.';if(won)recordScore(score);$('end').classList.add('show')}function start(){level=0;seconds=240;score=0;active=true;clearInterval(timer);$('clock').textContent='04:00';$('end').classList.remove('show');render();timer=setInterval(()=>{if(!active)return;seconds--;$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)finish(false)},1000)}$('retry').addEventListener('click',start);start()})();
</script></body></html>
